# =============================================================================
# JFrog Platform Services – Inventory
# =============================================================================
# Two independent host groups: [xray_servers] and [catalog_servers].
# They CAN overlap (same VMs) or be completely separate.
# To co-locate, simply list the same hostnames in both groups.
# =============================================================================

# ── JFrog Xray nodes ─────────────────────────────────────────────────────────
[xray_servers]
xray-node-01.example.com  ansible_user=rhel_svc_account
xray-node-02.example.com  ansible_user=rhel_svc_account
# xray-node-03.example.com  ansible_user=rhel_svc_account  xray_node_id=xray3

[xray_servers:vars]
ansible_python_interpreter=/usr/bin/python3
# ansible_ssh_private_key_file=~/.ssh/id_rsa_jfrog
# ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyJump=bastion.example.com'

# ── JFrog Catalog nodes ───────────────────────────────────────────────────────
# To co-locate Catalog on the same VMs as Xray, list those same hostnames here.
[catalog_servers]
catalog-node-01.example.com  ansible_user=rhel_svc_account
catalog-node-02.example.com  ansible_user=rhel_svc_account

[catalog_servers:vars]
ansible_python_interpreter=/usr/bin/python3
# ansible_ssh_private_key_file=~/.ssh/id_rsa_jfrog

# ── Convenience super-group for ad-hoc commands across all JFrog nodes ────────
[jfrog_platform:children]
xray_servers
catalog_servers
