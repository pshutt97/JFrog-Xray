# =============================================================================
# JFrog Xray – Inventory
# =============================================================================
# Replace hostnames/IPs below with your actual targets.
# All hosts in [xray_servers] will receive the playbook.
#
# For a multi-node HA cluster, simply list each Xray node here; the role
# handles per-host configuration automatically via hostvars.
# =============================================================================

[xray_servers]
xray-node-01.example.com  ansible_user=rhel_svc_account
xray-node-02.example.com  ansible_user=rhel_svc_account

# Optionally override per-host variables inline:
# xray-node-03.example.com  ansible_user=rhel_svc_account  xray_node_id=xray3

[xray_servers:vars]
# Use Python 3 on RHEL 9
ansible_python_interpreter=/usr/bin/python3

# SSH key-based authentication (recommended)
# ansible_ssh_private_key_file=~/.ssh/id_rsa_xray

# Uncomment to use a bastion / jump host
# ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ProxyJump=bastion.example.com'
