---
# =============================================================================
# vault/secrets.yml  (EXAMPLE – encrypt with: ansible-vault encrypt secrets.yml)
# =============================================================================
# This file holds all sensitive values referenced by the playbook.
# NEVER commit an unencrypted version of this file to source control.
#
# Encrypt:   ansible-vault encrypt vault/secrets.yml
# Edit:      ansible-vault edit vault/secrets.yml
# View:      ansible-vault view vault/secrets.yml
# Decrypt:   ansible-vault decrypt vault/secrets.yml
#
# Reference in inventory/group_vars/xray_servers.yml like:
#   xray_db_password: "{{ vault_xray_db_password }}"
# =============================================================================

vault_xray_db_password:    "REPLACE_ME_WITH_STRONG_PASSWORD"
vault_xray_rmq_password:   "REPLACE_ME_WITH_STRONG_PASSWORD"
vault_catalog_db_password: "REPLACE_ME_WITH_STRONG_PASSWORD"
vault_jfrog_admin_token:   "REPLACE_ME_WITH_ARTIFACTORY_ACCESS_TOKEN"
