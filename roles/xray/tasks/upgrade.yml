---
# =============================================================================
# tasks/upgrade.yml
# In-place upgrade of an existing JFrog Xray installation.
# Only reached when xray_action == 'upgrade' AND preflight confirms an
# existing installation is present.
#
# Upgrade strategy:
#   1. Drain in-flight scans (configurable timeout)
#   2. Optionally snapshot the data directory
#   3. Download & extract the new installer
#   4. Run the upgradeXray.sh script
#   5. Verify the new version is active
# =============================================================================

# ── 1. Drain in-flight scans ─────────────────────────────────────────────────
# Xray exposes a REST API endpoint to query scan queue depth.
# We poll until the queue drains or the timeout is reached.

- name: "[UPGRADE] Wait for Xray scan queue to drain"
  ansible.builtin.uri:
    url: "http://localhost:{{ xray_http_port }}/api/v1/system/ping"
    method: GET
    status_code: 200
    timeout: 10
  register: drain_check
  retries: "{{ (xray_upgrade_drain_timeout / 10) | int }}"
  delay: 10
  until: drain_check.status == 200
  failed_when: false
  changed_when: false

- name: "[UPGRADE] Stop Xray service gracefully before upgrade"
  ansible.builtin.systemd:
    name: "{{ xray_service_name }}"
    state: stopped
  register: xray_stop_result

- name: "[UPGRADE] Confirm Xray service is stopped"
  ansible.builtin.systemd:
    name: "{{ xray_service_name }}"
  register: xray_stopped_state
  failed_when: xray_stopped_state.status.ActiveState not in ['inactive', 'failed']
  changed_when: false

# ── 2. Pre-upgrade backup (optional) ─────────────────────────────────────────

- name: "[UPGRADE] Create timestamped backup directory"
  ansible.builtin.file:
    path: "{{ xray_upgrade_backup_dir }}/xray-{{ xray_installed_version }}-{{ ansible_date_time.epoch }}"
    state: directory
    owner: "{{ xray_system_user }}"
    group: "{{ xray_system_group }}"
    mode: "0750"
  register: backup_dir
  when: xray_upgrade_backup

- name: "[UPGRADE] Back up Xray data directory (rsync)"
  ansible.posix.synchronize:
    src: "{{ xray_data_dir }}/"
    dest: "{{ backup_dir.path }}/"
    archive: true
    checksum: true
    delete: false
  delegate_to: "{{ inventory_hostname }}"
  become: true
  when: xray_upgrade_backup

- name: "[UPGRADE] Record backup location"
  ansible.builtin.debug:
    msg: "Backup written to: {{ backup_dir.path }}"
  when: xray_upgrade_backup

# ── 3. Download new installer ─────────────────────────────────────────────────

- name: "[UPGRADE] Download new Xray installer archive"
  ansible.builtin.get_url:
    url: "{{ xray_download_url }}"
    dest: "{{ xray_installer_dir }}/{{ xray_installer_archive }}"
    owner: "{{ xray_system_user }}"
    group: "{{ xray_system_group }}"
    mode: "0640"
    timeout: 300
    force: true            # Always re-download to avoid stale cached tarballs
  register: xray_upgrade_download
  retries: 3
  delay: 15
  until: xray_upgrade_download is succeeded
  environment:
    http_proxy: "{{ xray_http_proxy | default(omit) }}"
    https_proxy: "{{ xray_https_proxy | default(omit) }}"
    no_proxy: "{{ xray_no_proxy | default(omit) }}"

# ── 4. Extract new installer ──────────────────────────────────────────────────

- name: "[UPGRADE] Extract new Xray installer archive"
  ansible.builtin.unarchive:
    src: "{{ xray_installer_dir }}/{{ xray_installer_archive }}"
    dest: "{{ xray_installer_dir }}"
    remote_src: true
    owner: "{{ xray_system_user }}"
    group: "{{ xray_system_group }}"

- name: "[UPGRADE] Set extracted installer directory fact"
  ansible.builtin.set_fact:
    xray_extracted_dir: "{{ xray_installer_dir }}/xray-{{ xray_version }}"

- name: "[UPGRADE] Ensure upgrade script is executable"
  ansible.builtin.file:
    path: "{{ xray_extracted_dir }}/{{ xray_installer_upgrade_script }}"
    mode: "0755"

# ── 5. Write system.yaml for upgrade ─────────────────────────────────────────

- name: "[UPGRADE] Write installer config (system.yaml) from template"
  ansible.builtin.template:
    src: system.yaml.j2
    dest: "{{ xray_extracted_dir }}/system.yaml"
    owner: "{{ xray_system_user }}"
    group: "{{ xray_system_group }}"
    mode: "0640"

# ── 6. Execute upgrade script ─────────────────────────────────────────────────

- name: "[UPGRADE] Execute Xray upgrade script"
  ansible.builtin.command:
    cmd: >-
      {{ xray_extracted_dir }}/{{ xray_installer_upgrade_script }}
      --install-dir {{ xray_install_dir }}
      --data-dir    {{ xray_data_dir }}
      --log-dir     {{ xray_log_dir }}
      --config      {{ xray_extracted_dir }}/system.yaml
  become_user: root
  register: xray_upgrade_result
  notify:
    - Reload systemd daemon
    - Start Xray service

- name: "[UPGRADE] Display upgrade script output"
  ansible.builtin.debug:
    var: xray_upgrade_result.stdout_lines
  when: xray_upgrade_result.stdout_lines is defined

# ── 7. Post-upgrade verification ──────────────────────────────────────────────

- name: "[UPGRADE] Wait for Xray service to become healthy after upgrade"
  ansible.builtin.uri:
    url: "http://localhost:{{ xray_http_port }}/api/v1/system/ping"
    method: GET
    status_code: 200
    timeout: 10
  register: post_upgrade_ping
  retries: 18
  delay: 10
  until: post_upgrade_ping.status == 200

- name: "[UPGRADE] Confirm upgraded version"
  ansible.builtin.command:
    cmd: "{{ xray_install_dir }}/app/bin/xray --version"
  register: upgraded_version_raw
  changed_when: false

- name: "[UPGRADE] Assert running version matches requested version"
  ansible.builtin.assert:
    that: xray_version in upgraded_version_raw.stdout
    fail_msg: >-
      Version mismatch after upgrade!
      Expected {{ xray_version }}, binary reports: {{ upgraded_version_raw.stdout }}.
    success_msg: "✔ Upgrade confirmed – Xray {{ xray_version }} is running."

- name: "[UPGRADE] Display upgrade summary"
  ansible.builtin.debug:
    msg:
      - "=== Upgrade Complete ==="
      - "Previous version : {{ xray_installed_version }}"
      - "Current version  : {{ xray_version }}"
      - "Backup location  : {{ backup_dir.path | default('N/A (backup disabled)') }}"
