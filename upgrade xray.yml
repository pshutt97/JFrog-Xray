---
# =============================================================================
# JFrog Xray Upgrade Playbook (RPM / Red Hat / CentOS)
# =============================================================================
# Supports: Xray 3.x → 3.x upgrades on RPM-based systems
# Based on: https://docs.jfrog.com/installation/docs/upgrading-from-xray-version-3-x-to-3-x
#
# Usage:
#   ansible-playbook -i inventory.ini upgrade_xray.yml \
#     -e "xray_version=3.107.0" \
#     [-e "dry_run=true"]          # Preview without changes
#
# Variables (set in group_vars or pass with -e):
#   xray_version      – target Xray version (required)
#   xray_home         – default: /opt/jfrog/xray
#   xray_user         – default: xray
#   xray_service      – default: xray.service
#   backup_dir        – default: /opt/jfrog/backups/xray
#   download_base_url – JFrog releases URL (can point to internal mirror)
#   dry_run           – set to true to skip destructive steps (default: false)
# =============================================================================

- name: JFrog Xray Upgrade (RPM)
  hosts: xray_servers
  become: true
  serial: 1   # Rolling upgrade — one node at a time for HA setups
  vars:
    xray_home: /opt/jfrog/xray
    xray_user: xray
    xray_service: xray.service
    backup_dir: /opt/jfrog/backups/xray
    download_base_url: "https://releases.jfrog.io/artifactory/jfrog-rpms/xray"
    dry_run: false

  pre_tasks:
    # ------------------------------------------------------------------ #
    # GUARD: ensure required variable is set
    # ------------------------------------------------------------------ #
    - name: Fail if xray_version is not defined
      ansible.builtin.fail:
        msg: "You must pass -e 'xray_version=<version>' (e.g. 3.107.0)"
      when: xray_version is not defined

    - name: Print upgrade summary
      ansible.builtin.debug:
        msg:
          - "==================================================="
          - " JFrog Xray RPM Upgrade"
          - "  Host        : {{ inventory_hostname }}"
          - "  Target ver  : {{ xray_version }}"
          - "  Xray home   : {{ xray_home }}"
          - "  Dry run     : {{ dry_run }}"
          - "==================================================="

  tasks:
    # ================================================================== #
    # BLOCK 1: Pre-flight checks
    # ================================================================== #
    - name: "[PRE-FLIGHT] Check current Xray version"
      ansible.builtin.command:
        cmd: "{{ xray_home }}/app/bin/xray --version"
      register: current_version_raw
      changed_when: false
      failed_when: false

    - name: "[PRE-FLIGHT] Show current version"
      ansible.builtin.debug:
        msg: "Current Xray version: {{ current_version_raw.stdout | default('unknown') }}"

    - name: "[PRE-FLIGHT] Check Artifactory connectivity"
      ansible.builtin.uri:
        url: "{{ artifactory_url }}/artifactory/api/system/ping"
        method: GET
        status_code: 200
        timeout: 10
      register: artifactory_ping
      when: artifactory_url is defined
      failed_when: false

    - name: "[PRE-FLIGHT] Warn if Artifactory is unreachable"
      ansible.builtin.debug:
        msg: "WARNING: Artifactory at {{ artifactory_url }} is not reachable. Upgrade may fail."
      when:
        - artifactory_url is defined
        - artifactory_ping.status is defined
        - artifactory_ping.status != 200

    - name: "[PRE-FLIGHT] Check available disk space (needs ≥ 5 GB free)"
      ansible.builtin.shell: |
        df -BG {{ xray_home }} | awk 'NR==2{gsub("G",""); print $4}'
      register: free_gb
      changed_when: false

    - name: "[PRE-FLIGHT] Fail if disk space is insufficient"
      ansible.builtin.fail:
        msg: "Insufficient disk space: {{ free_gb.stdout | trim }} GB free on {{ xray_home }}. Need at least 5 GB."
      when: (free_gb.stdout | trim | int) < 5

    - name: "[PRE-FLIGHT] Check PostgreSQL storage (expand by 2.5x before upgrade)"
      ansible.builtin.debug:
        msg: >
          REMINDER: JFrog recommends increasing PostgreSQL storage by at least
          2.5x its current size before upgrading. Ensure this is done externally.

    # ================================================================== #
    # BLOCK 2: RabbitMQ feature flag migration (required for 3.70+)
    # ================================================================== #
    - name: "[RABBITMQ] Check installed RabbitMQ version"
      ansible.builtin.shell: |
        {{ xray_home }}/app/third-party/rabbitmq/sbin/rabbitmqctl status 2>/dev/null \
          | grep -i 'RabbitMQ version' | awk '{print $NF}' || echo "unknown"
      register: rmq_version_raw
      changed_when: false
      failed_when: false

    - name: "[RABBITMQ] Show RabbitMQ version"
      ansible.builtin.debug:
        msg: "Current RabbitMQ version: {{ rmq_version_raw.stdout | trim }}"

    - name: "[RABBITMQ] Enable feature flags (required before upgrade to 3.70+)"
      ansible.builtin.shell: |
        sudo -H -u {{ xray_user }} bash -c \
          '{{ xray_home }}/app/third-party/rabbitmq/sbin/rabbitmqctl enable_feature_flag all'
      register: rmq_flags
      changed_when: rmq_flags.rc == 0
      failed_when: rmq_flags.rc != 0
      when: not dry_run
      ignore_errors: true   # Non-fatal on versions that don't support it

    - name: "[RABBITMQ] Feature flag output"
      ansible.builtin.debug:
        msg: "{{ rmq_flags.stdout_lines | default(['(dry run — skipped)']) }}"

    # ================================================================== #
    # BLOCK 3: Backup
    # ================================================================== #
    - name: "[BACKUP] Ensure backup directory exists"
      ansible.builtin.file:
        path: "{{ backup_dir }}/{{ xray_version }}"
        state: directory
        owner: "{{ xray_user }}"
        mode: "0750"

    - name: "[BACKUP] Back up system.yaml"
      ansible.builtin.copy:
        src: "{{ xray_home }}/var/etc/system.yaml"
        dest: "{{ backup_dir }}/{{ xray_version }}/system.yaml.bak"
        remote_src: true
        owner: "{{ xray_user }}"
        mode: "0640"
      when: not dry_run

    - name: "[BACKUP] Back up xray.default (service config)"
      ansible.builtin.copy:
        src: /etc/opt/jfrog/xray/xray.default
        dest: "{{ backup_dir }}/{{ xray_version }}/xray.default.bak"
        remote_src: true
        owner: "{{ xray_user }}"
        mode: "0640"
      failed_when: false
      when: not dry_run

    - name: "[BACKUP] Record pre-upgrade RPM info"
      ansible.builtin.shell: |
        rpm -qa | grep -i xray > {{ backup_dir }}/{{ xray_version }}/pre_upgrade_rpm_list.txt
      changed_when: false
      when: not dry_run

    # ================================================================== #
    # BLOCK 4: Download new RPM package
    # ================================================================== #
    - name: "[DOWNLOAD] Set RPM filename"
      ansible.builtin.set_fact:
        xray_rpm_file: "jfrog-xray-{{ xray_version }}-rpm.sh"
        xray_rpm_url: "{{ download_base_url }}/{{ xray_version }}/jfrog-xray-{{ xray_version }}-rpm.sh"
        xray_download_dest: "/tmp/jfrog-xray-{{ xray_version }}-rpm.sh"

    - name: "[DOWNLOAD] Download Xray RPM installer"
      ansible.builtin.get_url:
        url: "{{ xray_rpm_url }}"
        dest: "{{ xray_download_dest }}"
        mode: "0755"
        timeout: 300
      register: download_result
      when: not dry_run

    - name: "[DOWNLOAD] Verify download succeeded"
      ansible.builtin.stat:
        path: "{{ xray_download_dest }}"
      register: rpm_stat
      when: not dry_run

    - name: "[DOWNLOAD] Fail if RPM was not downloaded"
      ansible.builtin.fail:
        msg: "RPM installer not found at {{ xray_download_dest }}. Download may have failed."
      when:
        - not dry_run
        - not rpm_stat.stat.exists

    # ================================================================== #
    # BLOCK 5: Stop the Xray service
    # ================================================================== #
    - name: "[STOP] Stop Xray service"
      ansible.builtin.systemd:
        name: "{{ xray_service }}"
        state: stopped
      register: stop_result
      when: not dry_run

    - name: "[STOP] Confirm Xray service is stopped"
      ansible.builtin.systemd:
        name: "{{ xray_service }}"
      register: service_status
      when: not dry_run

    - name: "[STOP] Fail if service is still running"
      ansible.builtin.fail:
        msg: "Xray service failed to stop. Aborting upgrade."
      when:
        - not dry_run
        - service_status.status.ActiveState == "active"

    # ================================================================== #
    # BLOCK 6: Fix incompatible Erlang (known issue on some versions)
    # ================================================================== #
    - name: "[ERLANG] Check for incompatible Erlang package (known issue 3.16.2 / 3.71)"
      ansible.builtin.shell: |
        rpm -qa | grep esl-erlang || echo "none"
      register: erlang_check
      changed_when: false
      failed_when: false

    - name: "[ERLANG] Remove incompatible Erlang if present"
      ansible.builtin.shell: |
        rpm -e --nodeps esl-erlang
      when:
        - not dry_run
        - erlang_check.stdout != "none"
      failed_when: false

    # ================================================================== #
    # BLOCK 7: Install the new version
    # ================================================================== #
    - name: "[INSTALL] Run Xray RPM installer script"
      ansible.builtin.shell: |
        {{ xray_download_dest }} -- --upgrade
      args:
        chdir: /tmp
      register: install_result
      when: not dry_run
      timeout: 600

    - name: "[INSTALL] Show installer output"
      ansible.builtin.debug:
        msg: "{{ install_result.stdout_lines | default(['(dry run — skipped)']) }}"

    - name: "[INSTALL] Fail if installer exited with error"
      ansible.builtin.fail:
        msg: "Installer failed: {{ install_result.stderr }}"
      when:
        - not dry_run
        - install_result.rc is defined
        - install_result.rc != 0

    # ================================================================== #
    # BLOCK 8: Start the service and verify
    # ================================================================== #
    - name: "[START] Start Xray service"
      ansible.builtin.systemd:
        name: "{{ xray_service }}"
        state: started
        enabled: true
        daemon_reload: true
      when: not dry_run

    - name: "[START] Wait for Xray to become healthy (up to 5 min)"
      ansible.builtin.uri:
        url: "http://localhost:8000/api/v1/system/ping"
        method: GET
        status_code: 200
        timeout: 10
      register: health_check
      retries: 30
      delay: 10
      until: health_check.status == 200
      when: not dry_run

    - name: "[START] Confirm Xray service is running"
      ansible.builtin.systemd:
        name: "{{ xray_service }}"
      register: final_status
      when: not dry_run

    - name: "[START] Report service status"
      ansible.builtin.debug:
        msg: "Xray service state: {{ final_status.status.ActiveState | default('N/A (dry run)') }}"

    # ================================================================== #
    # BLOCK 9: Post-upgrade validation
    # ================================================================== #
    - name: "[VALIDATE] Check new Xray version"
      ansible.builtin.command:
        cmd: "{{ xray_home }}/app/bin/xray --version"
      register: new_version_raw
      changed_when: false
      failed_when: false
      when: not dry_run

    - name: "[VALIDATE] Confirm version matches target"
      ansible.builtin.assert:
        that:
          - xray_version in (new_version_raw.stdout | default(''))
        fail_msg: >
          Version mismatch! Expected {{ xray_version }},
          got: {{ new_version_raw.stdout | default('unknown') }}
        success_msg: "Version confirmed: {{ new_version_raw.stdout }}"
      when: not dry_run

    - name: "[VALIDATE] Check Xray log for errors"
      ansible.builtin.shell: |
        tail -50 {{ xray_home }}/var/log/xray-service.log 2>/dev/null \
          | grep -iE "ERROR|FATAL" | head -20 || echo "No critical errors found."
      register: log_check
      changed_when: false
      when: not dry_run

    - name: "[VALIDATE] Log check output"
      ansible.builtin.debug:
        msg: "{{ log_check.stdout_lines | default([]) }}"
      when: not dry_run

    # ================================================================== #
    # BLOCK 10: Cleanup
    # ================================================================== #
    - name: "[CLEANUP] Remove downloaded RPM installer"
      ansible.builtin.file:
        path: "{{ xray_download_dest }}"
        state: absent
      when: not dry_run

  post_tasks:
    - name: "[DONE] Upgrade complete"
      ansible.builtin.debug:
        msg:
          - "==================================================="
          - " JFrog Xray upgrade finished on {{ inventory_hostname }}"
          - "  Target version : {{ xray_version }}"
          - "  Dry run        : {{ dry_run }}"
          - "  Backups stored : {{ backup_dir }}/{{ xray_version }}/"
          - "  Next steps     :"
          - "    1. Review Xray logs: {{ xray_home }}/var/log/"
          - "    2. Validate DB migration in migration log"
          - "    3. Verify policies and scans in Xray UI"
          - "    4. If HA: proceed to next node"
          - "==================================================="
