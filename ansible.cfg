# =============================================================================
# ansible.cfg – Project-scoped Ansible configuration
# =============================================================================
# Ansible reads this file from the directory where you run ansible-playbook.
# Project-scoped settings here take precedence over ~/.ansible.cfg and
# /etc/ansible/ansible.cfg, making the project self-contained.
# =============================================================================

[defaults]
inventory          = inventory/hosts.ini
roles_path         = roles
collections_paths  = ~/.ansible/collections:/usr/share/ansible/collections
remote_user        = rhel_svc_account
host_key_checking  = True
retry_files_enabled = False
stdout_callback    = yaml           # Human-readable output format
callbacks_enabled  = timer, profile_tasks

# Increase the default SSH timeout for large file transfers (installer downloads)
timeout = 60

# Control how many hosts Ansible manages in parallel (default: 5).
# Reduce to 1 for cautious rolling upgrades, increase for faster installs.
forks = 5

# Log all task results to a file for post-run auditing
log_path = /tmp/ansible-xray-{{ lookup('env', 'USER') }}.log

[privilege_escalation]
become       = True
become_method = sudo
become_user  = root
become_ask_pass = False

[ssh_connection]
# SSH multiplexing: reuse a single connection per host, dramatically
# reducing connection overhead for plays with many tasks.
ssh_args     = -C -o ControlMaster=auto -o ControlPersist=60s
pipelining   = True       # Reduces the number of SSH operations per task

[vault]
# Uncomment and set to your vault password file path to avoid interactive prompts:
# vault_password_file = ~/.vault_pass
