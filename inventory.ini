# =============================================================================
# inventory.ini — JFrog Xray Upgrade Inventory
# =============================================================================
# Edit the hostnames/IPs below to match your environment.
# For HA setups, list all Xray nodes under [xray_servers].
# The playbook uses serial: 1 so nodes are upgraded one at a time.

[xray_servers]
xray-node-01.example.com
xray-node-02.example.com   # Remove/comment out if single-node

[xray_servers:vars]
ansible_user=ec2-user               # Change to your SSH user (e.g. centos, rhel, ec2-user)
ansible_ssh_private_key_file=~/.ssh/your_key.pem

# Xray-specific variables
xray_home=/opt/jfrog/xray
xray_user=xray
xray_service=xray.service
backup_dir=/opt/jfrog/backups/xray

# Artifactory URL (used for connectivity pre-check)
artifactory_url=https://artifactory.example.com

# JFrog releases mirror (change if using an internal proxy/mirror)
download_base_url=https://releases.jfrog.io/artifactory/jfrog-rpms/xray
